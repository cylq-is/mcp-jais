[project]
name = "jaapi"
version = "0.1.0"
description = "FastAPI wrapper around ja.is search and listing pages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "httpx",
    "mcp>=2.3.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
]
